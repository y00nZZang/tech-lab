apiVersion: v1
kind: Namespace
metadata:
  name: grpc-lb-mesh-lab
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-mesh
  namespace: grpc-lb-mesh-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-mesh
  template:
    metadata:
      labels:
        app: backend-mesh
    spec:
      containers:
      - name: backend-mesh
        image: grpc-k8s-lab:local
        imagePullPolicy: IfNotPresent
        env:
        - name: WORK_MS
          value: "50"
        - name: MAX_CONCURRENCY
          value: "4"
        - name: MAX_CONNECTION_AGE_MS
          value: "0"
        - name: ENABLE_CHANNELZ
          value: "1"
        ports:
        - name: grpc
          containerPort: 50051
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 1
          periodSeconds: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-mesh
  namespace: grpc-lb-mesh-lab
spec:
  selector:
    app: backend-mesh
  ports:
  - name: grpc
    appProtocol: grpc
    port: 50051
    targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-client
  namespace: grpc-lb-mesh-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-client
  template:
    metadata:
      labels:
        app: mesh-client
    spec:
      containers:
      - name: mesh-client
        image: grpc-k8s-lab:local
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
